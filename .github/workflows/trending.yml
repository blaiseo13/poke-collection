name: Refresh trending prices
# Rebuilds data/trending.js every morning so the Trending tab stays fresh with the laptop closed.
on:
  schedule:
    - cron: '15 11 * * *'   # 11:15 UTC = early morning Eastern
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build trending data
        run: node tools/trending.js
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/trending.js; then echo "no change"; exit 0; fi
          git config user.name "trending-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trending.js
          git commit -m "Daily trending prices"
          git push
