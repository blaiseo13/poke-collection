<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -14 112 112">
  <!-- Poké Collection emblem: an ember orb split by a wavy flame band (original design) -->
  <defs>
    <radialGradient id="molten" cx="42%" cy="30%" r="70%">
      <stop offset="0" stop-color="#FFF6C2"/>
      <stop offset=".28" stop-color="#FFC233"/>
      <stop offset=".6" stop-color="#FF6A00"/>
      <stop offset="1" stop-color="#B81E00"/>
    </radialGradient>
    <linearGradient id="coal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A1C0E"/>
      <stop offset="1" stop-color="#160704"/>
    </linearGradient>
    <radialGradient id="core" cx="45%" cy="40%" r="60%">
      <stop offset="0" stop-color="#FFFBE6"/>
      <stop offset=".45" stop-color="#FFD24D"/>
      <stop offset="1" stop-color="#FF5A00"/>
    </radialGradient>
    <linearGradient id="lick" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FF5A00"/>
      <stop offset=".6" stop-color="#FFB020"/>
      <stop offset="1" stop-color="#FFE680" stop-opacity=".2"/>
    </linearGradient>
    <clipPath id="orb"><circle cx="50" cy="54" r="40"/></clipPath>
  </defs>
  <!-- flames licking off the top -->
  <g class="licks" fill="url(#lick)">
    <path class="l1" d="M28 28 C22 16 31 8 28 -2 C40 6 42 18 38 28 Z"/>
    <path class="l2" d="M44 20 C38 6 50 -2 48 -12 C62 0 62 12 57 21 Z"/>
    <path class="l3" d="M62 26 C60 14 70 8 71 0 C79 11 77 21 72 29 Z"/>
  </g>
  <g clip-path="url(#orb)">
    <rect x="0" y="0" width="100" height="100" fill="url(#molten)"/>
    <!-- lower half: charcoal under a wavy flame line -->
    <path d="M6 62 C18 50 28 70 40 58 S60 44 72 54 S88 58 96 48 L96 100 L6 100 Z" fill="url(#coal)"/>
    <g fill="#FF8A1F" opacity=".9">
      <circle cx="26" cy="80" r="1.4"/><circle cx="40" cy="88" r="1"/><circle cx="62" cy="82" r="1.6"/><circle cx="74" cy="72" r="1"/><circle cx="52" cy="76" r=".9"/>
    </g>
  </g>
  <!-- the wavy band -->
  <g clip-path="url(#orb)"><path d="M6 62 C18 50 28 70 40 58 S60 44 72 54 S88 58 96 48" fill="none" stroke="#1E0803" stroke-width="5.5"/></g>
  <circle cx="50" cy="54" r="40" fill="none" stroke="#1E0803" stroke-width="4.5"/>
  <!-- ember core -->
  <circle cx="50" cy="52" r="11.5" fill="#1E0803"/>
  <circle class="core" cx="50" cy="52" r="7" fill="url(#core)"/>
  <circle cx="47.5" cy="49.5" r="2" fill="#fff" opacity=".85"/>
</svg>
